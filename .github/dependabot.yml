version: 2
updates:
  # Bot dependencies (requirements.txt) and CI tools (requirements-ci.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    open-pull-requests-limit: 5
    # The bot and the CI run Python 3.11; numpy 2.5 and later require
    # Python 3.12, so those versions cannot be installed and must not be proposed.
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
    groups:
      securite:
        applies-to: security-updates
        patterns: ["*"]
  # Actions used by the workflows: keeps the pinned commit SHAs up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Douala
    groups:
      actions:
        patterns: ["*"]
